name: Update Homebrew Tap

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published stable version (empty uses the latest release)"
        required: false
        type: string
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

env:
  TAP_REPO: drhelius/homebrew-drhelius

jobs:
  update-tap:
    name: Update Homebrew Tap
    if: github.repository == 'drhelius/smac-gog-mac-launcher'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Check tap credentials
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::Set HOMEBREW_TAP_TOKEN with Contents read/write access to $TAP_REPO."
            exit 1
          fi

      - name: Checkout Homebrew tap repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TAP_REPO }}
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Prepare cask from the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.release.tag_name }}
        run: |
          python3 scripts/update_homebrew.py --version "$RELEASE_VERSION" --output homebrew-tap/Casks/smac-launcher.rb
          ruby -c homebrew-tap/Casks/smac-launcher.rb

      - name: Commit and push to tap repository
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/smac-launcher.rb
          if git diff --cached --quiet; then
            echo "The tap already has this release."
            exit 0
          fi
          VERSION=$(sed -n 's/^  version "\([^"]*\)"/\1/p' Casks/smac-launcher.rb)
          git commit -m "Update SMAC Launcher to $VERSION"
          git pull --rebase origin main
          git push origin HEAD:main
