name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test the importer and runtime handling
        run: make test
      - name: Build universal application
        run: make dist
      - name: Verify package contains no game or runtime files
        run: python3 scripts/check_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Centauri-macOS-development
          path: |
            dist/Centauri-*-macOS.zip
            dist/SHA256SUMS
          if-no-files-found: error
