name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install movie-hook build tools
        run: |
          brew install llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
      - name: Test the importer and runtime handling
        run: make test
      - name: Build universal application
        run: make dist
      - name: Verify package contains no game or runtime files
        run: python3 scripts/check_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: SMAC-Launcher-macOS
          path: |
            dist/SMAC-Launcher-*-macOS.zip
            dist/SHA256SUMS
            dist/ffmpeg-*.tar.xz
          if-no-files-found: error
